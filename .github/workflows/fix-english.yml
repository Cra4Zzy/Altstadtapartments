name: Polish English pages
on:
  push:
    paths:
      - '.github/scripts/fix_english.py'
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Polish English language pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_english.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/
          git commit -m "Polish English language pages" || exit 0
          git push
