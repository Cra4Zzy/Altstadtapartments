name: Reviews and content refresh

on:
  push:
    paths:
      - '.github/scripts/reviews_refresh.py'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'Add verified guest reviews and 2026 content'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh content
        run: python .github/scripts/reviews_refresh.py
      - name: Commit refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/css/style.css
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add verified guest reviews and 2026 content"
          git push
