name: Complete English cleanup

on:
  push:
    paths:
      - '.github/scripts/complete_english_cleanup.py'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Polish all English pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean English pages
        run: python .github/scripts/complete_english_cleanup.py
      - name: Commit polished English pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Polish all English pages"
          git push
