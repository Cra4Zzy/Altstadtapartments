name: Apartment pages upgrade

on:
  push:
    paths:
      - '.github/scripts/apartment_pages_upgrade.py'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message != 'Upgrade apartment detail pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upgrade apartment pages
        run: python .github/scripts/apartment_pages_upgrade.py
      - name: Commit upgraded pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstadtapartment.html designapartment.html assets/css/style.css
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Upgrade apartment detail pages"
          git push
