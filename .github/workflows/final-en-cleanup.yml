name: Final English cleanup
on:
  push:
    paths:
      - '.github/scripts/final_en_cleanup.py'
permissions:
  contents: write
jobs:
  clean:
    if: github.event.head_commit.message != 'Final English cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/final_en_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/
          git commit -m "Final English cleanup" || exit 0
          git push
