name: Fix English plurals

on:
  push:
    paths:
      - '.github/scripts/fix_english_plurals.py'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix English bedroom plurals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_english_plurals.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix English bedroom plurals"
          git push
