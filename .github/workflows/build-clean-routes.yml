name: Build clean routes

on:
  push:
    paths:
      - '.github/scripts/build_clean_routes.py'

permissions:
  contents: write

jobs:
  build-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean directory routes
        run: python .github/scripts/build_clean_routes.py
      - name: Commit clean routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Use clean URLs across all pages"
          git push
