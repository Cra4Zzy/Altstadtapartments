name: Final English polish

on:
  push:
    paths:
      - '.github/scripts/final_english_polish.py'

permissions:
  contents: write

jobs:
  polish:
    if: github.event.head_commit.message != 'Finalise English translations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish remaining English fragments
        run: python .github/scripts/final_english_polish.py
      - name: Commit final English pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Finalise English translations"
          git push
